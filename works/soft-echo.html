<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiroshige: Case study | Nohar Cohen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="work-page">
    <header class="project-detail-header">
      <a class="brand" href="../index.html">Nohar Cohen</a>
      <a class="back-link" href="../works.html">Back to projects</a>
    </header>
    <main class="work-detail">
      <section class="work-detail-copy">
        <p class="section-kicker">Selected work</p>
        <h1>Hiroshige: Case study</h1>
        <p>2025</p>
      </section>
      <div class="work-detail-gallery" aria-label="Hiroshige case study artworks">
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Study of &quot;Maple Trees at Mama&quot; close up">
            <img src="../images/hiroshige-case-study-1.jpg" alt="Study of &quot;Maple Trees at Mama&quot;" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Study of "Maple Trees at Mama"</h2>
            <p>colored pencils on MDF, 51x29 cm, 2025.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Study of &quot;View From Massaki&quot; close up">
            <img src="../images/hiroshige-case-study-2.jpg" alt="Study of &quot;View From Massaki&quot;" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Study of "View From Massaki"</h2>
            <p>colored pencils on MDF, 60x41 cm, 2025.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Study of &quot;Plum Estate at Kameido&quot; close up">
            <img src="../images/hiroshige-case-study-3.jpg" alt="Study of &quot;Plum Estate at Kameido&quot;" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Study of "Plum Estate at Kameido"</h2>
            <p>colored pencils on MDF, 35x31 cm, 2025.</p>
          </figcaption>
        </figure>
      </div>
    </main>
    <dialog class="artwork-lightbox" aria-label="Close-up artwork view">
      <button class="lightbox-zoom" type="button" aria-pressed="false">Zoom in</button>
      <button class="lightbox-close" type="button" aria-label="Close enlarged artwork">Close</button>
      <img alt="" />
    </dialog>
    <script src="../script.js"></script>
  </body>
</html>
