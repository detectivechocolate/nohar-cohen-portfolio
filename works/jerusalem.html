<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerusalem | Nohar Cohen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="work-page">
    <header class="project-detail-header">
      <a class="brand" href="../index.html">Nohar Cohen</a>
      <a class="back-link" href="../works.html">Back to projects</a>
    </header>
    <main class="work-detail">
      <section class="work-detail-copy">
        <p class="section-kicker">Selected work</p>
        <h1>Jerusalem</h1>
        <p>2020</p>
      </section>
      <div class="work-detail-gallery" aria-label="Jerusalem project images">
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View A bar at the Hotel Waldorf Astoria, Jerusalem close up">
            <img src="../images/jerusalem-1.jpg" alt="A bar at the Hotel Waldorf Astoria, Jerusalem" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>A bar at the Hotel Waldorf Astoria, Jerusalem</h2>
            <p>oil painting on canvas, 45x55 cm.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Bastet, Jerusalem close up">
            <img src="../images/jerusalem-2.jpg" alt="Bastet, Jerusalem" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Bastet, Jerusalem</h2>
            <p>oil painting on canvas, 45x55 cm.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Babet, Jerusalem close up">
            <img src="../images/jerusalem-3.jpg" alt="Babet, Jerusalem" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Babet, Jerusalem</h2>
            <p>oil painting on canvas, 45x55 cm.</p>
          </figcaption>
        </figure>
      </div>
    </main>
    <dialog class="artwork-lightbox" aria-label="Close-up artwork view">
      <button class="lightbox-zoom" type="button" aria-pressed="false">Zoom in</button>
      <button class="lightbox-close" type="button" aria-label="Close enlarged artwork">Close</button>
      <img alt="" />
    </dialog>
    <script src="../script.js"></script>
  </body>
</html>
