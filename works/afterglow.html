<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topography of Time | Nohar Cohen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="work-page">
    <header class="project-detail-header">
      <a class="brand" href="../index.html">Nohar Cohen</a>
      <a class="back-link" href="../works.html">Back to projects</a>
    </header>
    <main class="work-detail">
      <section class="work-detail-copy">
        <p class="section-kicker">Selected work</p>
        <h1>Topography of Time</h1>
        <p>colored pencils on MDF, 244x122 cm</p>
        <p>2023</p>
      </section>
      <div class="work-detail-gallery" aria-label="Topography of Time artworks">
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Topography of Time, volume 3 close up">
            <img src="../images/topography-of-time/topography-of-time-3.jpg" alt="Topography of Time, volume 3" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Topography of Time, Vol. 3</h2>
            <p>colored pencils on MDF, 244x122 cm.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Topography of Time, volume 2 close up">
            <img src="../images/topography-of-time/topography-of-time-2.jpg" alt="Topography of Time, volume 2" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Topography of Time, Vol. 2</h2>
            <p>colored pencils on MDF, 122x180 cm.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Topography of Time, volume 1 close up">
            <img src="../images/topography-of-time/topography-of-time-1.jpg" alt="Topography of Time, volume 1" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Topography of Time, Vol. 1</h2>
            <p>colored pencils on MDF, 122x180 cm.</p>
          </figcaption>
        </figure>
      </div>
    </main>
    <dialog class="artwork-lightbox" aria-label="Close-up artwork view">
      <button class="lightbox-zoom" type="button" aria-pressed="false">Zoom in</button>
      <button class="lightbox-close" type="button" aria-label="Close enlarged artwork">Close</button>
      <img alt="" />
    </dialog>
    <script src="../script.js"></script>
  </body>
</html>
