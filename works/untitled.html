<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled | Nohar Cohen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="work-page">
    <header class="project-detail-header">
      <a class="brand" href="../index.html">Nohar Cohen</a>
      <a class="back-link" href="../works.html">Back to projects</a>
    </header>
    <main class="work-detail">
      <section class="work-detail-copy">
        <p class="section-kicker">Selected work</p>
        <h1>Untitled</h1>
      </section>
      <div class="work-detail-gallery" aria-label="Untitled project images">
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Untitled image 1 close up">
            <img src="../images/untitled.jpg" alt="Untitled, image 1" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Untitled</h2>
            <p>oil painting on plywood, 30x20 cm, 2021.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Untitled image 2 close up">
            <img src="../images/untitled-2.jpg" alt="Untitled, image 2" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Untitled</h2>
            <p>oil painting on plywood, 70x50 cm, 2020.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <button class="artwork-zoom" type="button" aria-label="View Untitled image 3 close up">
            <img src="../images/untitled-3.jpg" alt="Untitled, image 3" />
          </button>
          <figcaption class="work-gallery-caption">
            <h2>Untitled</h2>
            <p>oil painting on plywood, 60x44 cm, 2020.</p>
          </figcaption>
        </figure>
        <figure class="work-gallery-item">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID"
            title="Untitled video artwork"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
            aria-label="Untitled video artwork"
          ></iframe>
          <figcaption class="work-gallery-caption">
            <h2>Untitled</h2>
            <p>video work, 2024.</p>
          </figcaption>
        </figure>
      </div>
    </main>
    <dialog class="artwork-lightbox" aria-label="Close-up artwork view">
      <button class="lightbox-zoom" type="button" aria-pressed="false">Zoom in</button>
      <button class="lightbox-close" type="button" aria-label="Close enlarged artwork">Close</button>
      <img alt="" />
    </dialog>
    <script src="../script.js"></script>
  </body>
</html>
