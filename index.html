<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nohar Cohen</title>
    <meta
      name="description"
      content="Contemporary art portfolio for Nohar, featuring paintings, exhibitions, and contact information."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="art-showcase">
      <section class="showcase-content" aria-label="Nohar Cohen artworks">
        <h1 class="showcase-title">Nohar Cohen</h1>
        <nav class="showcase-menu" aria-label="Main menu">
          <a href="index.html" aria-current="page">Home</a>
          <a href="exhibitions.html">About &amp; CV</a>
          <a href="works.html">Works</a>
          <a href="works/archive.html">Project: Archive of Unknown Places</a>
          <a href="contact.html">Contact</a>
        </nav>
        <div class="art-frame featured-frame" aria-label="Featured artwork">
          <div class="art-piece piece-large featured-piece featured-piece--current preview-1" role="img" aria-label="Artwork preview"></div>
          <div class="art-piece piece-large featured-piece featured-piece--next" role="img" aria-label="Artwork preview" aria-hidden="true"></div>
          <button class="featured-arrow featured-arrow--previous" type="button" aria-label="Previous artwork" title="Previous artwork">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button class="featured-arrow featured-arrow--next" type="button" aria-label="Next artwork" title="Next artwork">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
